<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novos Caminhos</title>

  <style>
    :root {
      --bg: #10191b;
      --surface: #172426;
      --primary: #e7b86b;
      --primary-dark: #c89445;
      --text: #f5f1e8;
      --muted: #aeb8b5;
      --line: #2c3b3d;
      --soft: #dce6df;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% -10%, #294044 0%, transparent 42%),
        var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      padding: 14px 30px;
    }

    .page {
      position: relative;
      overflow: hidden;
      width: min(100%, 960px);
      min-height: calc(100vh - 28px);
      background: rgba(23, 36, 38, .94);
      border: 1px solid rgba(220, 230, 223, .08);
      border-radius: 32px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .38);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 112px 52px 68px;
      text-align: center;
    }

    .page::before {
      content: "";
      position: absolute;
      width: 560px;
      height: 560px;
      border-radius: 50%;
      top: -350px;
      left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(231, 184, 107, .15), transparent 68%);
      pointer-events: none;
    }

    .page > * {
      position: relative;
      z-index: 1;
    }

    .mark {
      width: 154px;
      height: 154px;
      margin-bottom: 43px;
      border: 1px solid rgba(231, 184, 107, .35);
      border-radius: 50%;
      display: grid;
      place-items: center;
      position: relative;
      background: rgba(16, 25, 27, .48);
      box-shadow: inset 0 0 0 10px rgba(231, 184, 107, .025);
    }

    .mark::before,
    .mark::after {
      content: "";
      position: absolute;
      border-radius: 50%;
    }

    .mark::before {
      width: 112px;
      height: 112px;
      border: 2px solid var(--line);
    }

    .mark::after {
      width: 42px;
      height: 42px;
      background: var(--primary);
      box-shadow: 0 0 35px rgba(231, 184, 107, .2);
    }

    .mark span {
      position: relative;
      z-index: 2;
      font-size: 27px;
      font-weight: 700;
      color: var(--bg);
    }

    .headline {
      margin: 0;
      font-size: clamp(48px, 6vw, 76px);
      line-height: 1.08;
      letter-spacing: -2.8px;
      font-weight: 700;
      color: var(--text);
    }

    .headline .highlight {
      display: block;
      color: var(--primary);
      margin-top: 4px;
    }

    .subtitle {
      max-width: 650px;
      margin: 40px auto 0;
      font-size: clamp(21px, 2.5vw, 29px);
      line-height: 1.5;
      letter-spacing: -.3px;
      color: var(--muted);
      font-weight: 400;
    }

    .small-divider {
      width: 86px;
      height: 3px;
      background: var(--line);
      border-radius: 10px;
      margin: 63px 0 67px;
    }

    .instruction {
      margin: 0;
      max-width: 650px;
      font-size: clamp(22px, 2.6vw, 29px);
      line-height: 1.45;
      color: var(--soft);
      letter-spacing: -.4px;
    }

    .access-button {
      margin-top: 53px;
      width: min(100%, 540px);
      min-height: 108px;
      border: 1px solid rgba(231, 184, 107, .35);
      border-radius: 54px;
      background: linear-gradient(105deg, #d8a85b, #b98438);
      color: #17201f;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 29px;
      font-size: clamp(23px, 3vw, 33px);
      font-weight: 700;
      letter-spacing: -.6px;
      cursor: pointer;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .25);
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }

    .access-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
      box-shadow: 0 23px 48px rgba(0, 0, 0, .32);
    }

    .access-button:active {
      transform: translateY(0);
    }

    .access-button:focus-visible {
      outline: 4px solid rgba(231, 184, 107, .25);
      outline-offset: 5px;
    }

    .arrow {
      width: 45px;
      height: 45px;
      border: 2px solid rgba(23, 32, 31, .45);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 25px;
      line-height: 1;
    }

    .footer {
      width: min(100%, 750px);
      border-top: 1px solid var(--line);
      margin-top: 124px;
      padding-top: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 43px;
      color: #879390;
      font-size: clamp(17px, 2vw, 23px);
    }

    .footer-link {
      display: flex;
      align-items: center;
      gap: 14px;
      white-space: nowrap;
    }

    .footer-divider {
      height: 38px;
      width: 1px;
      background: var(--line);
    }

    @media (max-width: 700px) {
      body {
        padding: 0;
      }

      .page {
        min-height: 100vh;
        border-radius: 0;
        padding: 76px 24px 43px;
      }

      .mark {
        width: 132px;
        height: 132px;
        margin-bottom: 32px;
      }

      .mark::before {
        width: 96px;
        height: 96px;
      }

      .subtitle {
        margin-top: 29px;
      }

      .small-divider {
        margin: 45px 0 47px;
      }

      .instruction {
        font-size: 21px;
      }

      .access-button {
        min-height: 82px;
        margin-top: 37px;
        gap: 19px;
        font-size: 22px;
      }

      .arrow {
        width: 37px;
        height: 37px;
        font-size: 20px;
      }

      .footer {
        margin-top: 82px;
        padding-top: 28px;
        gap: 15px;
        font-size: 15px;
      }

      .footer-link {
        gap: 7px;
      }

      .footer-divider {
        height: 29px;
      }
    }

    @media (max-width: 390px) {
      .page {
        padding-left: 18px;
        padding-right: 18px;
      }

      .headline {
        letter-spacing: -1.8px;
      }

      .footer {
        gap: 10px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <div class="mark" aria-hidden="true">
      <span>+</span>
    </div>

    <h1 class="headline">
      Descubra novos
      <span class="highlight">caminhos.</span>
    </h1>

    <p class="subtitle">
      Conteúdos e possibilidades<br />
      reunidos em um só lugar<br />
      para facilitar sua próxima escolha.
    </p>

    <div class="small-divider" aria-hidden="true"></div>

    <p class="instruction">
      Acesse abaixo para<br />
      conhecer as opções disponíveis
    </p>

    <button class="access-button" type="button" onclick="acessarPlataforma()">
      <span>EXPLORAR AGORA</span>
      <span class="arrow">→</span>
    </button>

    <footer class="footer">
      <div class="footer-link">
        <span>Privacidade</span>
      </div>

      <div class="footer-divider" aria-hidden="true"></div>

      <div class="footer-link">
        <span>Termos de Uso</span>
      </div>
    </footer>

  </main>

  <script>
    const LINK_ACAO = "https://elegant-puppy-desenrolando.netlify.app/";

    function acessarPlataforma() {
      window.location.href = LINK_ACAO;
    }
  </script>
</body>
</html>
